<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grade Calculator</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🎓 Grade Calculator</h1>

    <div class="input-group">
        <label>CW1 Score</label>
        <input type="number" id="cw1" placeholder="Enter CW1 score">
    </div>

    <div class="input-group">
        <label>CW1 Weight (%)</label>
        <input
            type="number"
            id="weight1"
            placeholder="Example: 33.3"
            min="0"
            max="100"
            step="0.1">
    </div>

    <div class="input-group">
        <label>CW2 Score</label>
        <input type="number" id="cw2" placeholder="Enter CW2 score">
    </div>

    <div class="input-group">
        <label>CW2 Weight (%)</label>
        <input
            type="number"
            id="weight2"
            placeholder="Example: 66.7"
            min="0"
            max="100"
            step="0.1">
    </div>

    <button onclick="calculateGrade()">
        Calculate
    </button>

    <div class="result">

        <h2>Final Score</h2>
        <p id="finalScore">0.00%</p>

        <h2>Classification</h2>
        <p id="classification">-</p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
